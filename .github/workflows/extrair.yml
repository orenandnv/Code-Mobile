name: Extrair código

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extrair:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extrair ZIP
        run: |
          unzip -o CodeMobile-codigo.zip -d .
          rm CodeMobile-codigo.zip

      - name: Enviar arquivos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Extrair código do projeto"
          git push
